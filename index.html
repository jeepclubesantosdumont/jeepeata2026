<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeepata de Natal 2026 - Jeep Clube Santos Dumont</title>
  <!-- Fontes do Google para estilo festivo natalino e moderno -->
  <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       1. CONFIGURAÇÃO DE CORES E ESTILOS BASE
       ========================================================================== */
    :root {
      --bg-dark: #0a1128;
      --card-bg: rgba(26, 38, 76, 0.85);
      --text-light: #f1f5f9;
      --text-gold: #f6c445;
      --color-green: #10b981;
      --color-green-glow: rgba(16, 185, 129, 0.4);
      --color-yellow: #fbbf24;
      --color-yellow-glow: rgba(251, 191, 36, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top, #1c2d5a 0%, var(--bg-dark) 100%);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px 50px 15px;
      position: relative;
      overflow-x: hidden;
    }

    /* ==========================================================================
       2. DECORAÇÃO NATALINA (LUZES PISCANTES)
       ========================================================================== */
    .christmas-lights {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 800px;
      margin-bottom: 20px;
      padding: 0 10px;
      list-style: none;
    }

    .christmas-lights li {
      width: 12px;
      height: 20px;
      border-radius: 50%;
      position: relative;
      animation: flash 1.5s infinite ease-in-out alternate;
    }

    .christmas-lights li:nth-child(4n+1) { background: #ef4444; box-shadow: 0 0 10px #ef4444; animation-delay: 0s; }
    .christmas-lights li:nth-child(4n+2) { background: #10b981; box-shadow: 0 0 10px #10b981; animation-delay: 0.4s; }
    .christmas-lights li:nth-child(4n+3) { background: #fbbf24; box-shadow: 0 0 10px #fbbf24; animation-delay: 0.8s; }
    .christmas-lights li:nth-child(4n+4) { background: #3b82f6; box-shadow: 0 0 10px #3b82f6; animation-delay: 1.2s; }

    @keyframes flash {
      0% { opacity: 0.3; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1.1); }
    }

    /* ==========================================================================
       3. CABEÇALHO E MENSAGENS
       ========================================================================== */
    header {
      text-align: center;
      margin-bottom: 25px;
      z-index: 2;
    }

    h1 {
      font-family: 'Mountains of Christmas', cursive;
      font-size: 2.8rem;
      color: #ef4444;
      text-shadow: 0 0 12px rgba(239, 68, 68, 0.6), 2px 2px 4px rgba(0, 0, 0, 0.8);
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 1.1rem;
      color: var(--text-gold);
      font-weight: 600;
      margin-top: 4px;
    }

    .status-bar {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #94a3b8;
      background: rgba(15, 23, 42, 0.6);
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: inline-block;
    }

    /* Mensagem de percurso concluído */
    .banner-concluido {
      display: none;
      background: linear-gradient(135deg, #10b981 0%, #047857 100%);
      color: white;
      font-size: 1.3rem;
      font-weight: 700;
      padding: 15px 25px;
      border-radius: 12px;
      margin-bottom: 25px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
      animation: bounce 1.5s infinite;
      z-index: 10;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* ==========================================================================
       4. CONTAINER PRINCIPAL E ESTRADA
       ========================================================================== */
    .main-container {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      width: 100%;
      max-width: 650px;
      border-radius: 20px;
      padding: 40px 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }

    .road-wrapper {
      position: relative;
      margin: 0 auto;
      max-width: 480px;
      padding: 20px 0;
    }

    /* Linha amarela contínua de fundo */
    .road-line-bg {
      position: absolute;
      left: 120px;
      top: 40px;
      bottom: 40px;
      width: 8px;
      background-color: var(--color-yellow);
      border-radius: 4px;
      z-index: 1;
      box-shadow: 0 0 10px var(--color-yellow-glow);
    }

    /* Linha verde de progresso */
    .road-line-progress {
      position: absolute;
      left: 120px;
      top: 40px;
      height: 0;
      width: 8px;
      background-color: var(--color-green);
      border-radius: 4px;
      z-index: 2;
      transition: height 1s ease-in-out;
      box-shadow: 0 0 12px var(--color-green-glow);
    }

    /* ==========================================================================
       5. PONTOS DO PERCURSO E LOCALIDADES
       ========================================================================== */
    .waypoint {
      display: flex;
      align-items: center;
      position: relative;
      height: 100px;
      z-index: 3;
    }

    .waypoint:last-child {
      height: 40px;
    }

    /* Círculo indicador do local */
    .node-circle {
      position: absolute;
      left: 108px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: var(--color-yellow);
      border: 4px solid #1a264c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      transition: all 0.5s ease;
      box-shadow: 0 0 12px var(--color-yellow-glow);
    }

    .waypoint.completed .node-circle {
      background-color: var(--color-green);
      color: #ffffff;
      box-shadow: 0 0 15px var(--color-green-glow);
    }

    /* Nome do local */
    .location-info {
      margin-left: 160px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .location-name {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text-light);
      text-transform: capitalize;
      transition: color 0.3s ease;
    }

    .waypoint.completed .location-name {
      color: #ffffff;
    }

    .waypoint.active .location-name {
      color: var(--text-gold);
      font-weight: 700;
      text-shadow: 0 0 8px rgba(246, 196, 69, 0.5);
    }

    .badge-done {
      display: none;
      background: var(--color-green);
      color: white;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 700;
    }

    .waypoint.completed .badge-done {
      display: inline-block;
    }

    /* ==========================================================================
       6. JIPE NATALINO (ILUSTRAÇÃO E ANIMAÇÃO)
       ========================================================================== */
    .jeep-container {
      position: absolute;
      left: 20px;
      top: 20px;
      z-index: 10;
      transition: top 1s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .jeep-icon {
      width: 75px;
      height: 60px;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.6));
      animation: drive-bounce 0.6s infinite alternate ease-in-out;
    }

    @keyframes drive-bounce {
      0% {
