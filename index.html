<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jeepata de Natal 2026 - JCSD</title>
    
<style>
:root{
    --bg:#081221;
    --card:#102038;
    --yellow:#ffd54f;
    --green:#00c853;
    --white:#ffffff;
    --line-width:8px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:linear-gradient(180deg,#07111d,#102542);
    color:white;
    font-family:Arial, Helvetica, sans-serif;
    min-height:100vh;
    overflow-x:hidden;
}

.header{
    text-align:center;
    padding:30px 20px 10px;
}

.header h1{
    font-size:clamp(1.8rem,4vw,3rem);
    margin-bottom:10px;
}

.header p{
    color:#d4d4d4;
}

.status{
    text-align:center;
    margin-top:10px;
    color:#9de49d;
    font-weight:bold;
}

.container{
    max-width:1200px;
    margin:auto;
    position:relative;
    padding:40px 20px 80px;
}

/* Luzes natalinas */

.lights{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:30px;
}

.light{
    width:14px;
    height:14px;
    border-radius:50%;
    animation:blink 2s infinite;
}

.light:nth-child(4n+1){background:#ff1744;}
.light:nth-child(4n+2){background:#00e676;}
.light:nth-child(4n+3){background:#2979ff;}
.light:nth-child(4n+4){background:#ffd600;}

@keyframes blink{
    0%,100%{
        opacity:1;
        transform:scale(1);
    }
    50%{
        opacity:.4;
        transform:scale(.8);
    }
}

/* Área do percurso */

.route-wrapper{
    position:relative;
    max-width:900px;
    margin:0 auto;
}

.route{
    position:relative;
    display:flex;
    flex-direction:column;
    gap:0;
}

/* Jipe */

#jeep{
    position:absolute;
    left:calc(50% - 180px);
    font-size:42px;
    transition:top 1.5s ease;
    z-index:50;
}

.route-item{
    position:relative;
    min-height:110px;
}

.line{
    position:absolute;
    left:50%;
    top:0;
    width:var(--line-width);
    height:100%;
    transform:translateX(-50%);
    background:var(--yellow);
    z-index:1;
}

.line.completed{
    background:var(--green);
}

.circle{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:30px;
    height:30px;
    border-radius:50%;
    border:3px solid white;
    background:var(--yellow);
    z-index:2;
}

.circle.completed{
    background:var(--green);
}

.location{
    position:absolute;
    left:calc(50% + 35px);
    top:50%;
    transform:translateY(-50%);
    padding:12px 16px;
    background:rgba(255,255,255,.08);
    border-radius:12px;
    backdrop-filter:blur(8px);
    min-width:220px;
}

.location .name{
    font-weight:bold;
}

.location .done{
    color:#8cff8c;
    margin-top:5px;
}

.footer-message{
    text-align:center;
    margin-top:40px;
    font-size:1.4rem;
    color:#7bff7b;
    display:none;
}

.loading{
    text-align:center;
    margin-top:40px;
}

/* Mobile */

@media(max-width:768px){

    #jeep{
        left:15px;
        font-size:34px;
    }

    .line{
        left:90px;
    }

    .circle{
        left:90px;
    }

    .location{
        left:130px;
        min-width:auto;
        width:calc(100% - 150px);
    }
}
</style>
</head>

<body>

<div class="header">
    <h1>🎄 Jeepata de Natal 2026 🎄</h1>
    <h1>Jeep Clube Santos Dumont</h1>
    <p>Acompanhe em tempo real o percurso da Jeepata</p>

    <div class="lights">
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
    </div>

    <div class="status" id="lastUpdate">
        Carregando percurso...
    </div>
</div>

<div class="container">

    <div class="route-wrapper">

        <div id="jeep">🚙🎅</div>

        <div class="route" id="route"></div>

    </div>

    <div id="completedMessage" class="footer-message">
        🎄 Percurso concluído! Feliz Natal! 🎅
    </div>

    <div class="loading" id="loading">
        Carregando dados...
    </div>

</div>

<script>
/* ===================================================
   CONFIGURAÇÕES
=================================================== */

/*
Publique sua planilha em CSV e substitua a URL abaixo.

Exemplo:
https://docs.google.com/spreadsheets/d/SEU_ID/export?format=csv&gid=0
*/

const CSV_URL =
"https://docs.google.com/spreadsheets/d/1E7QJBlUk0kR5eXFFkAgqnYDBVEHry29ClCFTPONKnMI/export?format=csv&gid=0";

const UPDATE_INTERVAL = 30000;

/* ===================================================
   ELEMENTOS
=================================================== */

const routeContainer = document.getElementById("route");
const jeep = document.getElementById("jeep");
const loading = document.getElementById("loading");
const completedMessage = document.getElementById("completedMessage");
const lastUpdate = document.getElementById("lastUpdate");

/* ===================================================
   CSV -> JSON
=================================================== */

function csvToJson(csv){

    const lines = csv.trim().split("\n");

    if(lines.length <= 1){
        return [];
    }

    const headers = lines[0]
        .split(",")
        .map(h => h.trim());

    return lines
        .slice(1)
        .map(line => {

            const values = line.split(",");

            const obj = {};

            headers.forEach((header,index)=>{
                obj[header] = values[index]
                    ? values[index].replace(/"/g,"").trim()
                    : "";
            });

            return obj;
        });
}

/* ===================================================
   BUSCA PLANILHA
=================================================== */

async function loadRoute(){

    try{

        const response = await fetch(CSV_URL + "&nocache=" + Date.now());

        const csv = await response.text();

        const data = csvToJson(csv);

        renderRoute(data);

        loading.style.display = "none";

        lastUpdate.innerHTML =
            "Última atualização: " +
            new Date().toLocaleTimeString("pt-BR");

    }catch(error){

        console.error(error);

        loading.innerHTML =
            "Erro ao carregar a planilha.";

    }

}

/* ===================================================
   RENDERIZAÇÃO
=================================================== */

function renderRoute(locations){

    routeContainer.innerHTML = "";

    let nextIndex = -1;

    locations.forEach((item,index)=>{

        const completed =
            String(item.Percurso)
            .toLowerCase()
            .trim() === "sim";

        if(!completed && nextIndex === -1){
            nextIndex = index;
        }

        const div = document.createElement("div");

        div.className = "route-item";

        div.innerHTML = `
            <div class="line ${completed ? 'completed' : ''}"></div>

            <div class="circle ${completed ? 'completed' : ''}">
            </div>

            <div class="location">
                <div class="name">
                    ${item.Localidade || item.localidade || "Local"}
                </div>

                ${
                    completed
                    ?
                    '<div class="done">✅ Percorrido</div>'
                    :
                    '<div>🟡 Aguardando passagem</div>'
                }
            </div>
        `;

        routeContainer.appendChild(div);

    });

    moveJeep(locations,nextIndex);
}

/* ===================================================
   POSIÇÃO DO JIPE
=================================================== */

function moveJeep(locations,nextIndex){

    const allDone = nextIndex === -1;

    const routeItems =
        document.querySelectorAll(".route-item");

    if(routeItems.length === 0){
        return;
    }

    completedMessage.style.display =
        allDone ? "block" : "none";

    let targetItem;

    if(allDone){
        targetItem =
            routeItems[routeItems.length - 1];
    }else{
        targetItem =
            routeItems[nextIndex];
    }

    const top =
        targetItem.offsetTop +
        (targetItem.offsetHeight / 2) - 20;

    jeep.style.top = top + "px";
}

/* ===================================================
   INICIALIZAÇÃO
=================================================== */

loadRoute();

setInterval(() => {
    loadRoute();
}, UPDATE_INTERVAL);

</script>

</body>
</html>
