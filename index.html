<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acompanhamento da Jipeata de Natal 🎄🛻</title>
  <style>
    :root {
      --bg-color: #0d1b2a;
      --card-bg: #1b263b;
      --text-color: #e0e1dd;
      --color-pending: #ffd166;
      --color-completed: #06d6a0;
      --color-line-pending: #e6b800;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 2.2rem;
      color: #ffffff;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 1rem;
      color: #a0aec0;
    }

    .status-bar {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #48bb78;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 800px;
      border-radius: 12px;
      padding: 40px 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      overflow-x: auto;
    }

    /* Linha do Percurso */
    .timeline {
      display: flex;
      flex-direction: column;
      position: relative;
      margin: 0 auto;
      max-width: 600px;
      padding: 20px 0;
    }

    .step {
      display: flex;
      align-items: center;
      position: relative;
      min-height: 80px;
    }

    .step:last-child {
      min-height: auto;
    }

    /* Linha conectora vertical */
    .step::before {
      content: '';
      position: absolute;
      left: 20px;
      top: 20px;
      bottom: -60px;
      width: 6px;
      background-color: var(--color-line-pending);
      z-index: 1;
      transition: background-color 0.5s ease;
    }

    .step:last-child::before {
      display: none;
    }

    .step.completed::before {
      background-color: var(--color-completed);
    }

    /* Círculo da localização */
    .circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: var(--color-pending);
      border: 4px solid var(--card-bg);
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #1a202c;
      transition: all 0.5s ease;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    .step.completed .circle {
      background-color: var(--color-completed);
      color: #ffffff;
      box-shadow: 0 0 12px var(--color-completed);
    }

    /* Nome do local */
    .label {
      margin-left: 20px;
      font-size: 1.2rem;
      font-weight: 600;
      text-transform: capitalize;
      color: var(--text-color);
      transition: color 0.3s ease;
    }

    .step.completed .label {
      color: #ffffff;
    }

    .step.active .label {
      color: var(--color-completed);
      font-weight: 700;
    }

    /* Legenda */
    .legend {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
      font-size: 0.9rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-box {
      width: 16px;
      height: 16px;
      border-radius: 4px;
    }

    .legend-pending { background-color: var(--color-pending); }
    .legend-completed { background-color: var(--color-completed); }

    @media (max-width: 600px) {
      .container { padding: 30px 10px; }
      .label { font-size: 1rem; }
      .circle { width: 32px; height: 32px; }
      .step::before { left: 16px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>🎅 Jipeata de Natal 🛻</h1>
    <p class="subtitle">Acompanhe em tempo real o trajeto do Papai Noel</p>
    <div class="status-bar" id="last-update">Atualizando dados...</div>
  </header>

  <main class="container">
    <div class="timeline" id="timeline">
      <!-- Os pontos do percurso serão gerados dinamicamente via JS -->
    </div>

    <div class="legend">
      <div class="legend-item">
        <div class="legend-box legend-completed"></div>
        <span>Percorrido (Verde)</span>
      </div>
      <div class="legend-item">
        <div class="legend-box legend-pending"></div>
        <span>A Caminho (Amarelo)</span>
      </div>
    </div>
  </main>

  <script>
    // URL de exportação CSV da planilha pública fornecida
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1E7QJBlUk0kR5eXFFkAgqnYDBVEHry29ClCFTPONKnMI/export?format=csv';

    async function fetchRouteData() {
      try {
        const response = await fetch(`${SHEET_CSV_URL}&t=${new Date().getTime()}`);
        const csvText = await response.text();
        parseAndRenderCSV(csvText);
        
        const now = new Date();
        document.getElementById('last-update').innerText = 
          `Última atualização: ${now.toLocaleTimeString('pt-BR')}`;
      } catch (error) {
        console.error('Erro ao buscar dados da planilha:', error);
        document.getElementById('last-update').innerText = 
          'Erro ao atualizar dados. Tentando novamente em instantes...';
      }
    }

    function parseAndRenderCSV(csvText) {
      const lines = csvText.trim().split('\n');
      const timeline = document.getElementById('timeline');
      timeline.innerHTML = '';

      // Ignora o cabeçalho (linha 0) e itera pelas linhas de dados
      const items = [];
      for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const [local, percorrido] = lines[i].split(',').map(cell => cell.trim().replace(/^"|"$/g, ''));
        if (local) {
          items.push({
            local: local,
            percorrido: (percorrido || '').toLowerCase() === 'sim'
          });
        }
      }

      items.forEach((item, index) => {
        const step = document.createElement('div');
        step.className = `step ${item.percorrido ? 'completed' : ''}`;
        
        // Marca o último ponto atingido como o local ativo no momento
        if (item.percorrido && (index === items.length - 1 || !items[index + 1]?.percorrido)) {
          step.classList.add('active');
        }

        const circle = document.createElement('div');
        circle.className = 'circle';
        circle.innerText = index + 1;

        const label = document.createElement('div');
        label.className = 'label';
        label.innerText = item.local;

        step.appendChild(circle);
        step.appendChild(label);
        timeline.appendChild(step);
      });
    }

    // Carrega na abertura da página
    fetchRouteData();

    // Atualiza a cada 10 segundos (10000ms)
    setInterval(fetchRouteData, 10000);
  </script>
</body>
</html>
